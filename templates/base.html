<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SU Analytics - {% block title %}Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .sidebar { min-height: 100vh; background: #1a1f36; color: #fff; }
        .sidebar .nav-link { color: #a0aec0; padding: 12px 20px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: #2d3748; }
        .sidebar .nav-link i { margin-right: 10px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-card { padding: 20px; }
        .stat-card .number { font-size: 28px; font-weight: 700; }
        .stat-card .label { color: #718096; font-size: 14px; }
        .brand { padding: 20px; font-size: 20px; font-weight: 700; border-bottom: 1px solid #2d3748; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="brand">📊 SU Analytics</div>
                <nav class="nav flex-column mt-2">
                    <a class="nav-link" href="{% url 'dashboard' %}">📈 Dashboard</a>
                    <a class="nav-link" href="{% url 'add_event' %}">📅 Add Event</a>
                    <a class="nav-link" href="{% url 'add_analytics' %}">📊 Add Analytics</a>
                    <a class="nav-link" href="{% url 'report_dashboard' %}">📄 Reports</a>
                    <a class="nav-link" href="{% url 'admin:index' %}">⚙️ Admin</a>
                    <a class="nav-link" href="{% url 'logout' %}">🚪 Logout</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
