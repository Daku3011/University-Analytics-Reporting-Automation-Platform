{% extends 'base.html' %}
{% block title %}Monthly Report{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2>Monthly Report Generated</h2>
    <a href="{{ report.pdf_file.url }}" class="btn btn-primary" target="_blank">Download PDF</a>
</div>
<div class="card p-4">
    <p><strong>College:</strong> {{ report.college.name }}</p>
    <p><strong>Period:</strong> {{ report.get_month_display }} {{ report.year }}</p>
    <p><strong>Generated:</strong> {{ report.created_at }}</p>
    <iframe src="{{ report.pdf_file.url }}" width="100%" height="800px" style="border: 1px solid #ddd;"></iframe>
</div>
{% endblock %}
