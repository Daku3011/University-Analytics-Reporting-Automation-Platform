<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ title }} — Q{{ quarter }} {{ year }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap');

@page {
    size: A4;
    margin: 20mm 15mm 20mm 15mm;
    @bottom-right {
        content: "Page " counter(page) " of " counter(pages);
        font-family: 'Outfit', sans-serif;
        font-size: 8pt;
        color: #94a3b8;
        font-weight: 500;
    }
    @bottom-left {
        content: "Sarvajanik University • {{ title }}";
        font-family: 'Outfit', sans-serif;
        font-size: 8pt;
        color: #94a3b8;
        font-weight: 500;
    }
}
@page :first {
    margin: 0;
    @bottom-right { content: normal; }
    @bottom-left { content: normal; }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #334155;
    background: #ffffff;
    line-height: 1.7;
    font-size: 11.5pt;
    -webkit-print-color-adjust: exact;
}

/* ========== COVER PAGE ========== */
.cover {
    width: 210mm;
    height: 297mm;
    background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
    position: relative;
    page-break-after: always;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}
.cover::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
        radial-gradient(circle at 15% 20%, rgba(79, 70, 229, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.2) 0%, transparent 60%);
    z-index: 1;
}
.cover .grid-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 24px 24px;
    z-index: 2;
}
.cover .top-glow {
    position: absolute;
    top: 0;
    width: 100%;
    height: 8px;
    background: linear-gradient(90deg, #4f46e5, #06b6d4, #8b5cf6, #4f46e5);
    z-index: 3;
}
.cover .content-wrapper {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 40px;
}
.cover .brand {
    color: rgba(255, 255, 255, 0.35);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-family: 'Outfit', sans-serif;
}
.cover .cover-logo {
    width: 64px;
    height: 64px;
    margin-bottom: 20px;
}
.cover .report-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 12px;
    color: #818cf8;
    margin-bottom: 20px;
    text-transform: uppercase;
    font-family: 'Outfit', sans-serif;
}
.cover h1 {
    font-size: 44px;
    color: #ffffff;
    margin: 0;
    font-weight: 300;
    letter-spacing: 3px;
    line-height: 1.1;
    font-family: 'Outfit', sans-serif;
    text-transform: uppercase;
}
.cover h1 strong {
    font-weight: 800;
    color: #6366f1;
}
.cover .q-label {
    font-size: 56px;
    color: #06b6d4;
    margin: 20px 0 10px;
    font-weight: 800;
    letter-spacing: 4px;
    font-family: 'Outfit', sans-serif;
}
.cover .months-label {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 2px;
    font-weight: 500;
    margin-bottom: 35px;
    font-family: 'Outfit', sans-serif;
}
.cover .divider-line {
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, #4f46e5, #06b6d4);
    border-radius: 2px;
    margin: 0 auto 35px;
}
.cover .presented-by {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 500;
}
.cover .footer-note {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.2);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 600;
    z-index: 10;
}

/* ========== CONTENT PAGES & SECTIONS ========== */
.content {
    page-break-after: always;
    position: relative;
    box-sizing: border-box;
}
.content:last-child {
    page-break-after: avoid;
}

.ai-badge {
    background: linear-gradient(135deg, #f8fafc 0%, #fafbff 100%);
    border: 1px solid #e2e8f0;
    border-left: 4px solid #4f46e5;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 10.5pt;
    color: #4f46e5;
    font-weight: 600;
    margin-bottom: 25px;
    display: inline-block;
    font-family: 'Outfit', sans-serif;
}

/* Style AI Generated elements inside summary */
.content h2 {
    font-size: 16pt;
    font-weight: 700;
    color: #0f172a;
    margin: 28px 0 14px;
    padding-bottom: 6px;
    border-bottom: 2px solid #f1f5f9;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-family: 'Outfit', sans-serif;
}
.content h3 {
    font-size: 13pt;
    font-weight: 600;
    color: #1e1b4b;
    margin: 20px 0 10px;
    font-family: 'Outfit', sans-serif;
}
.content p {
    margin-bottom: 14px;
    color: #334155;
    line-height: 1.75;
}
.content ul, .content ol {
    margin: 12px 0 18px 24px;
}
.content li {
    margin-bottom: 8px;
    color: #334155;
    line-height: 1.7;
}
.content strong {
    color: #0f172a;
    font-weight: 700;
}

.section-box {
    background: #f8fafc;
    border-left: 4px solid #4f46e5;
    border-radius: 0 8px 8px 0;
    padding: 18px 22px;
    margin: 18px 0;
}

.footer {
    text-align: center;
    padding-top: 15px;
    border-top: 1px solid #e2e8f0;
    margin-top: 40px;
}
.footer p {
    margin: 2px 0;
    font-size: 9px;
    color: #94a3b8;
    letter-spacing: 1px;
    font-weight: 500;
}
</style>
</head>
<body>

<!-- ========== COVER PAGE ========== -->
<div class="cover">
    <div class="grid-overlay"></div>
    <div class="top-glow"></div>
    <div class="content-wrapper">
        <div class="brand">Sarvajanik University</div>
        <div class="report-label">Condensed Executive Summary</div>
        <h1>QUARTERLY <strong>BRIEF</strong></h1>
        <div class="q-label">Q{{ quarter }} {{ year }}</div>
        <div class="months-label">{{ quarter_label }}</div>
        <div class="divider-line"></div>
        <div class="presented-by">Consolidated via Gemini AI • Prepared by: {{ uploaded_by }}</div>
    </div>
</div>

<!-- ========== PAGE 1: CONTENT ========== -->
<div class="content">
    <div class="ai-badge">
        ✦ This intelligence brief was synthesized by Gemini AI from {{ months_covered }}
    </div>

    {{ ai_summary|safe }}
</div>

</body>
</html>
