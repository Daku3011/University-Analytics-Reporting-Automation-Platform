<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap');

@page {
    size: A4;
    margin: 20mm 15mm 20mm 15mm;
    @bottom-right {
        content: "Page " counter(page) " of " counter(pages);
        font-family: 'Outfit', sans-serif;
        font-size: 8pt;
        color: #94a3b8;
        font-weight: 500;
    }
    @bottom-left {
        content: "Sarvajanik University • {{ title }}";
        font-family: 'Outfit', sans-serif;
        font-size: 8pt;
        color: #94a3b8;
        font-weight: 500;
    }
}
@page :first {
    margin: 0;
    @bottom-right { content: normal; }
    @bottom-left { content: normal; }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #334155;
    background: #ffffff;
    line-height: 1.75;
    font-size: 11pt;
    -webkit-print-color-adjust: exact;
}

/* ========== COVER PAGE ========== */
.cover {
    width: 210mm;
    height: 297mm;
    background: linear-gradient(135deg, #042f2e 0%, #0f172a 60%, #1e1b4b 100%);
    position: relative;
    page-break-after: always;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}
.cover::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
        radial-gradient(circle at 15% 20%, rgba(13, 148, 136, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 85% 80%, rgba(79, 70, 229, 0.2) 0%, transparent 60%);
    z-index: 1;
}
.cover .grid-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 24px 24px;
    z-index: 2;
}
.cover .top-glow {
    position: absolute;
    top: 0;
    width: 100%;
    height: 8px;
    background: linear-gradient(90deg, #0d9488, #06b6d4, #4f46e5, #0d9488);
    z-index: 3;
}
.cover .content-wrapper {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 40px;
}
.cover .brand {
    color: rgba(255, 255, 255, 0.35);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-family: 'Outfit', sans-serif;
}
.cover .report-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 12px;
    color: #2dd4bf;
    margin-bottom: 20px;
    text-transform: uppercase;
    font-family: 'Outfit', sans-serif;
}
.cover h1 {
    font-size: 38px;
    color: #ffffff;
    margin: 0;
    font-weight: 300;
    letter-spacing: 3px;
    line-height: 1.2;
    font-family: 'Outfit', sans-serif;
    text-transform: uppercase;
}
.cover h1 strong {
    font-weight: 800;
    color: #0d9488;
}
.cover .date-label {
    font-size: 20px;
    color: rgba(255, 255, 255, 0.85);
    margin: 24px 0 10px;
    font-weight: 600;
    letter-spacing: 2px;
    font-family: 'Outfit', sans-serif;
}
.cover .months-label {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 2px;
    font-weight: 500;
    margin-bottom: 35px;
    font-family: 'Outfit', sans-serif;
}
.cover .divider-line {
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, #0d9488, #2dd4bf);
    border-radius: 2px;
    margin: 0 auto 35px;
}
.cover .presented-by {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 500;
}

/* ========== CONTENT PAGES & SECTIONS ========== */
.content {
    page-break-after: always;
    position: relative;
    box-sizing: border-box;
}
.content:last-child {
    page-break-after: avoid;
}

.ai-badge {
    background: linear-gradient(135deg, #f8fafc 0%, #f0fdfa 100%);
    border: 1px solid #ccfbf1;
    border-left: 4px solid #0d9488;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 10.5pt;
    color: #0f766e;
    font-weight: 600;
    margin-bottom: 25px;
    display: inline-block;
    font-family: 'Outfit', sans-serif;
}

/* Styling AI Generated elements */
.content h2 {
    font-size: 15pt;
    font-weight: 700;
    color: #0f172a;
    margin: 28px 0 14px;
    padding-bottom: 6px;
    border-bottom: 2px solid #ccfbf1;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-family: 'Outfit', sans-serif;
}
.content h3 {
    font-size: 12.5pt;
    font-weight: 600;
    color: #0f172a;
    margin: 20px 0 10px;
    font-family: 'Outfit', sans-serif;
}
.content p {
    margin-bottom: 14px;
    color: #334155;
    line-height: 1.75;
}
.content ul, .content ol {
    margin: 12px 0 18px 24px;
}
.content li {
    margin-bottom: 8px;
    color: #334155;
    line-height: 1.7;
}
.content strong {
    color: #0f172a;
    font-weight: 700;
}

/* Tables inside PDF */
.content table {
    width: 100%;
    border-collapse: collapse;
    margin: 18px 0;
    font-size: 10pt;
}
.content th {
    background: #0d9488;
    color: #ffffff;
    padding: 8px 12px;
    text-align: left;
    font-weight: 600;
    border: 1px solid #0d9488;
}
.content td {
    padding: 8px 12px;
    border: 1px solid #e2e8f0;
}
.content tr:nth-child(even) td {
    background: #f8fafc;
}

/* Metric grids in PDF */
.content .metric-grid {
    display: table;
    width: 100%;
    margin: 18px 0;
    border-spacing: 12px 0;
}
.content .metric-card {
    display: table-cell;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    border-top: 3px solid #0d9488;
}
.content .metric-value {
    font-size: 20pt;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 4px;
    font-family: 'Outfit', sans-serif;
}
.content .metric-label {
    font-size: 8.5pt;
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Highlight Quotes inside PDF */
.content .highlight-quote {
    background: #f0fdfa;
    border-left: 4px solid #0d9488;
    border-radius: 0 8px 8px 0;
    padding: 14px 18px;
    margin: 18px 0;
    font-style: italic;
    color: #0f766e;
    font-size: 11pt;
}

/* Chart Container inside PDF */
.content .chart-container {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 15px;
    margin: 20px 0;
    text-align: center;
    page-break-inside: avoid;
}
.content .chart-container svg {
    max-width: 160mm;
    height: auto;
}

.footer {
    text-align: center;
    padding-top: 15px;
    border-top: 1px solid #e2e8f0;
    margin-top: 40px;
}
.footer p {
    margin: 2px 0;
    font-size: 9px;
    color: #94a3b8;
    letter-spacing: 1px;
    font-weight: 500;
}
</style>
</head>
<body>

<!-- ========== COVER PAGE ========== -->
<div class="cover">
    <div class="grid-overlay"></div>
    <div class="top-glow"></div>
    <div class="content-wrapper">
        <div class="brand">Sarvajanik University</div>
        <div class="report-label">Annual Category Summary</div>
        <h1>ANNUAL <strong>PERFORMANCE</strong></h1>
        <div class="date-label">{{ title }}</div>
        <div class="months-label">Coverage: {{ start_date }} to {{ end_date }}</div>
        <div class="divider-line"></div>
        <div class="presented-by">Consolidated via Gemini AI • Synthesized: {{ created_at|date:"d M Y" }}</div>
    </div>
</div>

<!-- ========== CONTENT PAGES ========== -->
<div class="content">
    <div class="ai-badge">
        ✦ Consolidated Performance Intelligence synthesized from monthly data records.
    </div>

    {{ ai_summary|safe }}
</div>

</body>
</html>
