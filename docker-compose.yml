# ============================================================
# SU Analytics — Docker Compose (Development & Production)
# ============================================================
# Usage:
#   Development:  docker compose up
#   Production:   docker compose -f docker-compose.yml up -d
# ============================================================

services:
  # ── Redis (message broker for Celery) ──────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Web Application ─────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@su-analytics.in}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/accounts/login/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery Worker (background PDF generation) ──────────────
  celery:
    build: .
    restart: unless-stopped
    command: celery -A su_analytics worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy

volumes:
  media_data:
  static_data:
